<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMZ 💎</title>
    <style>
        :root {
            --primary: #2b5876;
            --secondary: #4e4376;
            --accent: #ff9f43;
            --light: #f8f9fa;
            --dark: #2d3436;
            --success: #2ecc71;
            --error: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 32px;
            letter-spacing: 2px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            background: var(--light);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
        }
        .timer-box {
            font-size: 48px;
            font-weight: bold;
            color: #d63031;
            margin: 15px 0;
            transition: color 0.3s;
        }
        .timer-box.time-low {
            color: #c0392b;
            animation: pulse 0.5s infinite;
        }
        .card-display {
            border: 3px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .card-category {
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .card-content {
            font-size: 18px;
            line-height: 1.5;
        }
        .taboo-list {
            margin-top: 15px;
            padding: 0;
            list-style: none;
        }
        .taboo-list li {
            text-transform: uppercase;
            font-weight: bold;
            color: #e74c3c;
            display: inline-block;
            margin: 0 8px;
            font-size: 14px;
            background: #fce4e4;
            padding: 3px 8px;
            border-radius: 5px;
        }
        .answer-box {
            margin-top: 15px;
            padding: 10px;
            background: #e8f8f5;
            border-radius: 8px;
            color: #27ae60;
            font-weight: bold;
            display: none;
            font-size: 15px;
            border: 1px dashed #2ecc71;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-draw { background-color: var(--accent); color: white; }
        .btn-reveal { background-color: #3498db; color: white; margin-bottom: 10px; width: 100%; }
        .btn-correct { background-color: #2ecc71; color: white; }
        .btn-wrong { background-color: #e74c3c; color: white; }
        .btn-reset { background-color: #7f8c8d; color: white; font-size: 14px; padding: 8px; margin-top: 15px; width: 100%; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #b2bec3; color: #dfe6e9; cursor: not-allowed; }

        /* Animations */
        @keyframes flash-green {
            0%, 100% { background: white; }
            50% { background: #d5f5e3; }
        }
        @keyframes shake-red {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .flash-success {
            animation: flash-green 0.6s ease;
        }
        .shake-fail {
            animation: shake-red 0.5s ease;
        }
        .score-pop {
            display: inline-block;
            animation: pop 0.4s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container" id="gameContainer">
    <div class="header">
        <h1>GEMZ 💎</h1>
    </div>

    <div class="scoreboard">
        <div>Team A: <span id="scoreA">0</span></div>
        <div>Current Turn: <span id="currentTeam">Team A</span></div>
        <div>Team B: <span id="scoreB">0</span></div>
    </div>

    <div class="timer-box" id="timer">60</div>

    <div class="card-display" id="cardDisplay">
        <div class="card-category">Ready?</div>
        <div class="card-content">Press "Draw Next Card" to start your turn!</div>
    </div>

    <button class="btn-reveal" id="btnReveal" onclick="revealAnswer()" style="display: none;">👁️ Reveal Answer</button>

    <div class="btn-group">
        <button class="btn-draw" id="btnDraw" onclick="drawCard()">Draw Next Card</button>
    </div>
    <div class="btn-group">
        <button class="btn-correct" id="btnCorrect" onclick="handleScore(true)" disabled>Correct</button>
        <button class="btn-wrong" id="btnWrong" onclick="handleScore(false)" disabled>Pass / Fail</button>
    </div>

    <button class="btn-reset" onclick="resetGame()">🔄 Reset Match Scores</button>
</div>

<!-- Sound Effects -->
<audio id="soundStart" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_0782a0c7d6.mp3?filename=game-start-6275.mp3"></audio>
<audio id="soundTimeUp" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=game-over-arcade-6453.mp3"></audio>
<audio id="soundCorrect" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_736f7a8062.mp3?filename=success-1-6297.mp3"></audio>
<audio id="soundWrong" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_34a16f7b73.mp3?filename=error-1-6298.mp3"></audio>

<script>
    const gameDeck = [
        // --- TRIVIA CARDS (1-POINT STANDARD) ---
        { type: "Trivia (1pt)", content: "Who was the first Christian martyr, stoned to death for his faith?", answer: "Stephen (Acts 7:54-60)" },
        { type: "Trivia (1pt)", content: "What is the last book of the Hebrew Scriptures (Old Testament)?", answer: "Malachi" },
        { type: "Trivia (1pt)", content: "Which apostle was known as 'the doubter' until he saw the resurrected Jesus?", answer: "Thomas (John 20:24-29)" },
        { type: "Trivia (1pt)", content: "What city did Paul and Silas preach in while imprisoned, causing an earthquake?", answer: "Philippi (Acts 16:25-26)" },
        { type: "Trivia (1pt)", content: "Who was the mother of Samuel, who dedicated him to Jehovah’s service?", answer: "Hannah (1 Samuel 1:20-28)" },
        { type: "Trivia (1pt)", content: "What was the name of the rich man who begged Abraham for relief from torment?", answer: "No name given (Luke 16:19-31)" },
        { type: "Trivia (1pt)", content: "Which king of Judah was healed of a serious illness after praying to Jehovah?", answer: "Hezekiah (2 Kings 20:1-6)" },
        { type: "Trivia (1pt)", content: "What miracle did Elisha perform for a widow who had only a small jar of oil?", answer: "Multiplied her oil (2 Kings 4:1-7)" },
        { type: "Trivia (1pt)", content: "Who was the Roman governor who presided over Jesus’ trial?", answer: "Pontius Pilate (Matthew 27:11-26)" },
        { type: "Trivia (1pt)", content: "What is the shortest verse in the Bible?", answer: "“Jesus wept.” (John 11:35)" },

        // --- TRIVIA CARDS (3-POINT DEEP RESEARCH) ---
        { type: "Trivia (3pt Deep)", content: "In what year did the Governing Body of Jehovah’s Witnesses move its headquarters to Warwick, New York?", answer: "2016" },
        { type: "Trivia (3pt Deep)", content: "What was the original name of the *Watchtower* magazine when first published in 1879?", answer: "Zion’s Watch Tower and Herald of Christ’s Presence" },
        { type: "Trivia (3pt Deep)", content: "Which Bible character said, 'As for me and my house, we will serve Jehovah'?", answer: "Joshua (Joshua 24:15)" },
        { type: "Trivia (3pt Deep)", content: "What was the name of the angel who appeared to Mary to announce Jesus’ birth?", answer: "Gabriel (Luke 1:26-38)" },
        { type: "Trivia (3pt Deep)", content: "How many books are in the Christian Greek Scriptures (New Testament)?", answer: "27" },
        { type: "Trivia (3pt Deep)", content: "Which prophet was fed by ravens during a drought?", answer: "Elijah (1 Kings 17:2-6)" },
        { type: "Trivia (3pt Deep)", content: "What was the name of the lame man Peter healed at the temple gate called Beautiful?", answer: "Not named in Acts 3:1-10" },
        { type: "Trivia (3pt Deep)", content: "Who was the first person to see the resurrected Jesus according to John 20?", answer: "Mary Magdalene (John 20:11-18)" },
        { type: "Trivia (3pt Deep)", content: "What language did Jesus most likely speak in everyday life?", answer: "Aramaic" },
        { type: "Trivia (3pt Deep)", content: "Which disciple replaced Judas Iscariot after his death?", answer: "Matthias (Acts 1:23-26)" },

        // --- DESCRIBE CARDS (TABOO STYLING) ---
        { type: "Describe", content: "Get your team to guess: <strong>THE CITY OF REFUGE</strong>", taboo: ["Levite", "Run", "Safety", "Shelter", "Accident"] },
        { type: "Describe", content: "Get your team to guess: <strong>NOAH'S ARK</strong>", taboo: ["Flood", "Wood", "Animals", "Rain", "Boat"] },
        { type: "Describe", content: "Get your team to guess: <strong>THE TEN COMMANDMENTS</strong>", taboo: ["Moses", "Stone", "Ten", "Law", "Mount"] },
        { type: "Describe", content: "Get your team to guess: <strong>DAVID AND GOLIATH</strong>", taboo: ["Giant", "Sling", "Stone", "Shepherd", "Fight"] },
        { type: "Describe", content: "Get your team to guess: <strong>THE LAST SUPPER</strong>", taboo: ["Jesus", "Bread", "Wine", "Disciples", "Night"] }
    ];

    let scoreA = 0;
    let scoreB = 0;
    let isTeamATurn = true;
    let timerInterval;
    let currentCardPoints = 1;
    let currentCardIndex = -1;
    let usedCardIndices = [];

    const cardDisplayEl = document.getElementById('cardDisplay');
    const btnDraw = document.getElementById('btnDraw');
    const btnReveal = document.getElementById('btnReveal');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');
    const timerEl = document.getElementById('timer');
    const gameContainer = document.getElementById('gameContainer');

    // Sound elements
    const soundStart = document.getElementById('soundStart');
    const soundTimeUp = document.getElementById('soundTimeUp');
    const soundCorrect = document.getElementById('soundCorrect');
    const soundWrong = document.getElementById('soundWrong');

    function playSound(soundEl) {
        soundEl.currentTime = 0;
        soundEl.play().catch(e => console.log("Audio play failed:", e));
    }

    function drawCard() {
        playSound(soundStart);

        const availableIndices = gameDeck
            .map((_, index) => index)
            .filter(index => !usedCardIndices.includes(index));

        if (availableIndices.length === 0) {
            cardDisplayEl.innerHTML = `
                <div class="card-category">All Cards Used</div>
                <div class="card-content">Reset the game to play again.</div>
            `;
            btnDraw.disabled = true;
            btnReveal.style.display = "none";
            btnCorrect.disabled = true;
            btnWrong.disabled = true;
            return;
        }

        currentCardIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        usedCardIndices.push(currentCardIndex);
        const card = gameDeck[currentCardIndex];

        currentCardPoints = card.type.includes("3pt") ? 3 : 1;

        let html = `<div class="card-category">${card.type}</div>
                    <div class="card-content">${card.content}</div>`;

        if (card.taboo) {
            html += `<ul class="taboo-list">`;
            card.taboo.forEach(word => {
                html += `<li>${word}</li>`;
            });
            html += `</ul>`;
        }

        if (card.answer) {
            html += `<div class="answer-box" id="answerBox">${card.answer}</div>`;
            btnReveal.style.display = "block";
        } else {
            btnReveal.style.display = "none";
        }

        cardDisplayEl.innerHTML = html;
        btnCorrect.disabled = false;
        btnWrong.disabled = false;
        btnDraw.disabled = true;

        startTimer();
    }

    function startTimer() {
        let timeLeft = 60;
        timerEl.textContent = timeLeft;
        timerEl.classList.remove('time-low');

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;

            if (timeLeft <= 10) {
                timerEl.classList.add('time-low');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                playSound(soundTimeUp);
                handleScore(false);
            }
        }, 1000);
    }

    function revealAnswer() {
        const answerBox = document.getElementById('answerBox');
        if (answerBox) {
            answerBox.style.display = "block";
        }
    }

    function handleScore(isCorrect) {
        clearInterval(timerInterval);
        timerEl.classList.remove('time-low');

        if (isCorrect) {
            playSound(soundCorrect);
            gameContainer.classList.add('flash-success');
            setTimeout(() => gameContainer.classList.remove('flash-success'), 600);

            if (isTeamATurn) {
                scoreA += currentCardPoints;
                const scoreEl = document.getElementById('scoreA');
                scoreEl.innerHTML = `<span class="score-pop">${scoreA}</span>`;
            } else {
                scoreB += currentCardPoints;
                const scoreEl = document.getElementById('scoreB');
                scoreEl.innerHTML = `<span class="score-pop">${scoreB}</span>`;
            }
        } else {
            playSound(soundWrong);
            gameContainer.classList.add('shake-fail');
            setTimeout(() => gameContainer.classList.remove('shake-fail'), 500);
        }

        setTimeout(endTurn, 800);
    }

    function endTurn() {
        isTeamATurn = !isTeamATurn;
        document.getElementById('currentTeam').textContent = isTeamATurn ? "Team A" : "Team B";
        cardDisplayEl.innerHTML = `<div class="card-category">Next Turn</div> <div class="card-content">Hand the device to the next team and press Draw!</div>`;
        btnDraw.disabled = false;
        btnReveal.style.display = "none";
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        timerEl.textContent = "60";
    }

    function resetGame() {
        if(confirm("Are you sure you want to reset the current game scores?")) {
            clearInterval(timerInterval);
            scoreA = 0;
            scoreB = 0;
            isTeamATurn = true;
            usedCardIndices = [];
            currentCardIndex = -1;
            document.getElementById('scoreA').textContent = "0";
            document.getElementById('scoreB').textContent = "0";
            document.getElementById('currentTeam').textContent = "Team A";
            timerEl.textContent = "60";
            timerEl.classList.remove('time-low');
            cardDisplayEl.innerHTML = `<div class="card-category">Ready?</div> <div class="card-content">Press "Draw Next Card" to start your turn!</div>`;
            btnDraw.disabled = false;
            btnReveal.style.display = "none";
            btnCorrect.disabled = true;
            btnWrong.disabled = true;
        }
    }
</script>

</body>
</html>
