<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Diggers App Prototype</title>
    <style>
        :root {
            --primary: #2b5876;
            --secondary: #4e4376;
            --accent: #ff9f43;
            --light: #f8f9fa;
            --dark: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            background: var(--light);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .timer-box {
            font-size: 48px;
            font-weight: bold;
            color: #d63031;
            margin: 15px 0;
        }
        .card-display {
            border: 3px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .card-category {
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .card-content {
            font-size: 18px;
            line-height: 1.5;
        }
        .taboo-list {
            margin-top: 10px;
            padding: 0;
            list-style: none;
            color: #7f8c8d;
        }
        .taboo-list li {
            text-decoration: line-through;
            display: inline-block;
            margin: 0 5px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-draw { background-color: var(--accent); color: white; }
        .btn-correct { background-color: #2ecc71; color: white; }
        .btn-wrong { background-color: #e74c3c; color: white; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #b2bec3; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>💎 Diggers Digital</h1>
    </div>

    <div class="scoreboard">
        <div>Team A: <span id="scoreA">0</span></div>
        <div>Current Turn: <span id="currentTeam">Team A</span></div>
        <div>Team B: <span id="scoreB">0</span></div>
    </div>

    <div class="timer-box" id="timer">60</div>

    <div class="card-display" id="cardDisplay">
        <div class="card-category">Ready?</div>
        <div class="card-content">Press "Draw Next Card" to start your turn!</div>
    </div>

    <div class="btn-group">
        <button class="btn-draw" id="btnDraw" onclick="drawCard()">Draw Next Card</button>
    </div>
    <div class="btn-group">
        <button class="btn-correct" id="btnCorrect" onclick="handleScore(true)" disabled>Correct</button>
        <button class="btn-wrong" id="btnWrong" onclick="handleScore(false)" disabled>Pass / Fail</button>
    </div>
</div>

<script>
    // Sample scriptural/theocratic card database matching game archetypes
    const gameDeck = [
        { type: "Trivia (1pt)", content: "Who was the left-handed judge who delivered Israel from Moabite oppression?", answer: "Ehud (Judges 3:15)" },
        { type: "Trivia (3pt Deep)", content: "What was the name of the first month of the Jewish sacred calendar before it was renamed 'Nisan'?", answer: "Abib (Exodus 13:4)" },
        { type: "Describe", content: "Get your team to guess: <strong>THE CITY OF REFUGE</strong>", taboo: ["Levite", "Run", "Safety", "Shelter"] },
        { type: "Action", content: "Act out silently: <strong>David defeating Goliath with a sling</strong>. No speaking or signing letters!" },
        { type: "Trivia (1pt)", content: "In what year did the Bible Students officially adopt the name 'Jehovah's Witnesses'?", answer: "1931" }
    ];

    let scoreA = 0;
    let scoreB = 0;
    let isTeamATurn = true;
    let timerInterval;
    let timeLeft = 60;
    let currentCardPoints = 1;

    const timerEl = document.getElementById('timer');
    const cardDisplayEl = document.getElementById('cardDisplay');
    const btnDraw = document.getElementById('btnDraw');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');

    function startTimer() {
        timeLeft = 60;
        timerEl.textContent = timeLeft;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time's up! Turn passes to the next team.");
                endTurn(false);
            }
        }, 1000);
    }

    function drawCard() {
        const randomIndex = Math.floor(Math.random() * gameDeck.length);
        const card = gameDeck[randomIndex];
        
        // Determine points
        currentCardPoints = card.type.includes("3pt") ? 3 : 1;

        // Render card content
        let htmlContent = `<div class="card-category">${card.type}</div>`;
        htmlContent += `<div class="card-content">${card.content}</div>`;
        
        if (card.taboo) {
            htmlContent += `<ul class="taboo-list">`;
            card.taboo.forEach(word => htmlContent += `<li>${word}</li>`);
            htmlContent += `</ul>`;
        }
        
        if (card.answer) {
            htmlContent += `<div style="margin-top:15px; font-size:14px; color:#2ecc71;">👉 Click Correct to reveal: ${card.answer}</div>`;
        }

        cardDisplayEl.innerHTML = htmlContent;

        // Toggle UI buttons
        btnDraw.disabled = true;
        btnCorrect.disabled = false;
        btnWrong.disabled = false;

        startTimer();
    }

    function handleScore(isCorrect) {
        clearInterval(timerInterval);
        if (isCorrect) {
            if (isTeamATurn) {
                scoreA += currentCardPoints;
                document.getElementById('scoreA').textContent = scoreA;
            } else {
                scoreB += currentCardPoints;
                document.getElementById('scoreB').textContent = scoreB;
            }
        }
        endTurn();
    }

    function endTurn() {
        // Switch teams
        isTeamATurn = !isTeamATurn;
        document.getElementById('currentTeam').textContent = isTeamATurn ? "Team A" : "Team B";
        
        // Reset card viewport
        cardDisplayEl.innerHTML = `
            <div class="card-category">Next Turn</div>
            <div class="card-content">Hand the phone to the other team and press Draw!</div>
        `;
        
        // Reset buttons
        btnDraw.disabled = false;
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        timerEl.textContent = "60";
    }
</script>

</body>
</html>
