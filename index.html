<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Card Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #222;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .scores {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin: 25px 0;
    }

    .score-box {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      background: #eef2ff;
    }

    .score {
      display: block;
      margin-top: 8px;
      font-size: 2rem;
      font-weight: bold;
      color: #3949ab;
    }

    .turn-info {
      margin: 15px 0;
      font-size: 1.1rem;
    }

    #currentTeam {
      font-weight: bold;
      color: #3949ab;
    }

    .timer {
      margin: 20px 0;
      font-size: 2.5rem;
      font-weight: bold;
      color: #d32f2f;
    }

    .card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 20px 0;
      padding: 25px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    .card-category {
      margin-bottom: 15px;
      font-size: 1rem;
      font-weight: bold;
      color: #777;
      text-transform: uppercase;
    }

    .card-content {
      font-size: 1.3rem;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: #3949ab;
    }

    button:hover:not(:disabled) {
      opacity: 0.85;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #btnReveal {
      background: #757575;
    }

    #btnCorrect {
      background: #2e7d32;
    }

    #btnWrong {
      background: #c62828;
    }

    #btnReset {
      background: #555;
    }
  </style>
</head>

<body>
  <main class="game-container">
    <h1>Team Card Game</h1>

    <div class="scores">
      <div class="score-box">
        Team A
        <span id="scoreA" class="score">0</span>
      </div>

      <div class="score-box">
        Team B
        <span id="scoreB" class="score">0</span>
      </div>
    </div>

    <div class="turn-info">
      Current turn:
      <span id="currentTeam">Team A</span>
    </div>

    <div id="timer" class="timer">60</div>

    <section id="cardDisplay" class="card">
      <div class="card-category">Ready?</div>
      <div class="card-content">
        Press "Draw Next Card" to start your turn!
      </div>
    </section>

    <div class="buttons">
      <button id="btnDraw">Draw Next Card</button>
      <button id="btnReveal" style="display: none;">Reveal Answer</button>
      <button id="btnCorrect" disabled>Correct</button>
      <button id="btnWrong" disabled>Wrong</button>
      <button id="btnReset">Reset Game</button>
    </div>
  </main>

  <script>
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const currentTeamEl = document.getElementById("currentTeam");
    const timerEl = document.getElementById("timer");
    const cardDisplayEl = document.getElementById("cardDisplay");

    const btnDraw = document.getElementById("btnDraw");
    const btnReveal = document.getElementById("btnReveal");
    const btnCorrect = document.getElementById("btnCorrect");
    const btnWrong = document.getElementById("btnWrong");
    const btnReset = document.getElementById("btnReset");

    let scoreA = 0;
    let scoreB = 0;
    let isTeamATurn = true;
    let timerInterval;
    let timeLeft = 60;

    const cards = [
      {
        category: "Charades",
        question: "Act out a movie without speaking.",
        answer: "Movie charades"
      },
      {
        category: "Drawing",
        question: "Draw something that flies.",
        answer: "An airplane, bird, or helicopter"
      },
      {
        category: "Trivia",
        question: "Name three animals in ten seconds.",
        answer: "Any three animals"
      },
      {
        category: "Words",
        question: "Describe a beach without using the word 'sand'.",
        answer: "Any suitable description"
      }
    ];

    let currentCard = null;

    btnDraw.addEventListener("click", drawCard);
    btnReveal.addEventListener("click", revealAnswer);
    btnCorrect.addEventListener("click", () => finishTurn(true));
    btnWrong.addEventListener("click", () => finishTurn(false));
    btnReset.addEventListener("click", resetGame);

    function drawCard() {
      currentCard = cards[Math.floor(Math.random() * cards.length)];

      cardDisplayEl.innerHTML = `
        <div class="card-category">${currentCard.category}</div>
        <div class="card-content">${currentCard.question}</div>
      `;

      btnDraw.disabled = true;
      btnReveal.style.display = "inline-block";
      btnCorrect.disabled = false;
      btnWrong.disabled = false;

      startTimer();
    }

    function revealAnswer() {
      if (!currentCard) return;

      cardDisplayEl.innerHTML = `
        <div class="card-category">Answer</div>
        <div class="card-content">${currentCard.answer}</div>
      `;

      btnReveal.style.display = "none";
    }

    function startTimer() {
      clearInterval(timerInterval);

      timeLeft = 60;
      timerEl.textContent = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finishTurn(false);
        }
      }, 1000);
    }

    function finishTurn(wasCorrect) {
      clearInterval(timerInterval);

      if (wasCorrect) {
        if (isTeamATurn) {
          scoreA++;
          scoreAEl.textContent = scoreA;
        } else {
          scoreB++;
          scoreBEl.textContent = scoreB;
        }
      }

      isTeamATurn = !isTeamATurn;
      currentTeamEl.textContent = isTeamATurn ? "Team A" : "Team B";

      cardDisplayEl.innerHTML = `
        <div class="card-category">Next Turn</div>
        <div class="card-content">
          Hand the device to the next team and press Draw!
        </div>
      `;

      btnDraw.disabled = false;
      btnReveal.style.display = "none";
      btnCorrect.disabled = true;
      btnWrong.disabled = true;
      timerEl.textContent = "60";
      currentCard = null;
    }

    function resetGame() {
      if (confirm("Are you sure you want to reset the current game scores?")) {
        clearInterval(timerInterval);

        scoreA = 0;
        scoreB = 0;
        isTeamATurn = true;
        currentCard = null;

        scoreAEl.textContent = "0";
        scoreBEl.textContent = "0";
        currentTeamEl.textContent = "Team A";
        timerEl.textContent = "60";

        cardDisplayEl.innerHTML = `
          <div class="card-category">Ready?</div>
          <div class="card-content">
            Press "Draw Next Card" to start your turn!
          </div>
        `;

        btnDraw.disabled = false;
        btnReveal.style.display = "none";
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
      }
    }
  </script>
</body>
</html>
