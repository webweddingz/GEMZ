<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Diggers App Prototype</title>
    <style>
        :root {
            --primary: #2b5876;
            --secondary: #4e4376;
            --accent: #ff9f43;
            --light: #f8f9fa;
            --dark: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            background: var(--light);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .timer-box {
            font-size: 48px;
            font-weight: bold;
            color: #d63031;
            margin: 15px 0;
        }
        .card-display {
            border: 3px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .card-category {
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .card-content {
            font-size: 18px;
            line-height: 1.5;
        }
        .taboo-list {
            margin-top: 15px;
            padding: 0;
            list-style: none;
        }
        .taboo-list li {
            text-transform: uppercase;
            font-weight: bold;
            color: #e74c3c;
            display: inline-block;
            margin: 0 8px;
            font-size: 14px;
            background: #fce4e4;
            padding: 3px 8px;
            border-radius: 5px;
        }
        .answer-box {
            margin-top: 15px;
            padding: 10px;
            background: #e8f8f5;
            border-radius: 8px;
            color: #27ae60;
            font-weight: bold;
            display: none;
            font-size: 15px;
            border: 1px dashed #2ecc71;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-draw { background-color: var(--accent); color: white; }
        .btn-reveal { background-color: #3498db; color: white; margin-bottom: 10px; width: 100%; }
        .btn-correct { background-color: #2ecc71; color: white; }
        .btn-wrong { background-color: #e74c3c; color: white; }
        .btn-reset { background-color: #7f8c8d; color: white; font-size: 14px; padding: 8px; margin-top: 15px; width: 100%; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #b2bec3; color: #dfe6e9; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>💎 Diggers Digital</h1>
    </div>

    <div class="scoreboard">
        <div>Team A: <span id="scoreA">0</span></div>
        <div>Current Turn: <span id="currentTeam">Team A</span></div>
        <div>Team B: <span id="scoreB">0</span></div>
    </div>

    <div class="timer-box" id="timer">60</div>

    <div class="card-display" id="cardDisplay">
        <div class="card-category">Ready?</div>
        <div class="card-content">Press "Draw Next Card" to start your turn!</div>
    </div>

    <button class="btn-reveal" id="btnReveal" onclick="revealAnswer()" style="display: none;">👁️ Reveal Answer</button>

    <div class="btn-group">
        <button class="btn-draw" id="btnDraw" onclick="drawCard()">Draw Next Card</button>
    </div>
    <div class="btn-group">
        <button class="btn-correct" id="btnCorrect" onclick="handleScore(true)" disabled>Correct</button>
        <button class="btn-wrong" id="btnWrong" onclick="handleScore(false)" disabled>Pass / Fail</button>
    </div>

    <button class="btn-reset" onclick="resetGame()">🔄 Reset Match Scores</button>
</div>

<script>
    const gameDeck = [
        // --- TRIVIA CARDS (1-POINT STANDARD) ---
        { type: "Trivia (1pt)", content: "Who was the left-handed judge who delivered Israel from Moabite oppression by executing King Eglon?", answer: "Ehud (Judges 3:15)" },
        { type: "Trivia (1pt)", content: "In what year did the Bible Students officially adopt the scriptural name 'Jehovah's Witnesses' at a convention in Columbus, Ohio?", answer: "1931 (Proclaimers, chap. 11)" },
        { type: "Trivia (1pt)", content: "In which prominent Middle Eastern river was Jesus baptized by John the Baptist?", answer: "Jordan River (Matthew 3:13)" },
        { type: "Trivia (1pt)", content: "According to the Genesis account, upon which mountainous region did Noah's ark finally come to rest as the floodwaters receded?", answer: "Mountains of Ararat (Genesis 8:4)" },
        { type: "Trivia (1pt)", content: "Which major body of water did Jehovah split so that the escaping Israelites could pass through safely on dry ground?", answer: "Red Sea (Exodus 14:21)" },
        { type: "Trivia (1pt)", content: "Which faithful Moabite woman expressed extraordinary loyalty to her mother-in-law Naomi with the famous words, 'Where you go I will go'?", answer: "Ruth (Ruth 1:16)" },
        { type: "Trivia (1pt)", content: "Charles Taze Russell published the very first issue of the magazine originally titled Zion's Watch Tower and Herald of Christ's Presence in which year?", answer: "1879 (July 1879)" },
        { type: "Trivia (1pt)", content: "Which faithful pre-Flood patriarch walked with the true God and was transferred so that he did not see death?", answer: "Enoch (Genesis 5:24 / Hebrews 11:5)" },
        { type: "Trivia (1pt)", content: "Jesus performed his very first recorded miracle—turning water into fine wine at a wedding feast—in which specific village of Galilee?", answer: "Cana (John 2:1-11)" },
        { type: "Trivia (1pt)", content: "With how many total men did Jehovah instruct Gideon to retain for battle against the massive host of Midianites?", answer: "300 men (Judges 7:7)" },

        // --- TRIVIA CARDS (3-POINT DEEP RESEARCH) ---
        { type: "Trivia (3pt Deep)", content: "What was the name of the first month of the Jewish sacred calendar before it was renamed 'Nisan' after the Babylonian exile?", answer: "Abib (Exodus 13:4)" },
        { type: "Trivia (3pt Deep)", content: "The Apostle John was exiled to the rocky island of Patmos where he received the visions of Revelation. In which specific sea is Patmos located?", answer: "Aegean Sea (Revelation 1:9)" },
        { type: "Trivia (3pt Deep)", content: "During the reign of which Medo-Persian ruler was Daniel thrown into the lions' pit because he continued praying to Jehovah?", answer: "Darius the Mede (Daniel 6:6-9)" },
        { type: "Trivia (3pt Deep)", content: "According to the opening verse of the book of Job, in what specific land did this faithful and blameless man reside?", answer: "The land of Uz (Job 1:1)" },
        { type: "Trivia (3pt Deep)", content: "Before traveling to Jerusalem to lead the rebuilding of its broken walls, Nehemiah held the high-ranking position of cupbearer to which Persian king?", answer: "Artaxerxes I (Nehemiah 2:1)" },
        { type: "Trivia (3pt Deep)", content: "In Paul's second letter to Timothy, the apostle speaks with deep appreciation about the unhypocritical faith that first dwelt in which two female relatives of Timothy?", answer: "Lois and Eunice (2 Timothy 1:5)" },
        { type: "Trivia (3pt Deep)", content: "When 'The Golden Age' was first published in October 1919, who was appointed by J.F. Rutherford to serve as its very first chief editor?", answer: "Clayton J. Woodworth" },
        { type: "Trivia (3pt Deep)", content: "During Paul's tumultuous voyage to Rome, his ship struggled against the wind and sought shelter by running under the lee of a tiny island named Cauda. This island sits off the southern coast of which massive Mediterranean island?", answer: "Crete (Acts 27:16)" },
        { type: "Trivia (3pt Deep)", content: "When Paul was shipwrecked on Melita (Malta), Acts 28:7 mentions a hospitable man named Publius who entertained the survivors. What specific official title did Publius hold on the island?", answer: "The Chief Man of the Island (Acts 28:7)" },
        { type: "Trivia (3pt Deep)", content: "Which faithful prophet was commanded by Jehovah to marry a woman named Gomer who later became unfaithful, using his painful domestic situation as a visual illustration?", answer: "Hosea (Hosea 1:2-3)" },

        // --- DESCRIBE CARDS (TABOO STYLING) ---
        { type: "Describe", content: "Get your team to guess: <strong>THE CITY OF REFUGE</strong>", taboo: ["Levite", "Run", "Safety", "Shelter", "Accident"] },
        { type: "Describe", content: "Get your team to guess: <strong>NOAH'S ARK</strong>", taboo: ["Flood", "Wood", "Animals", "Rain", "Boat"] },
        { type: "Describe", content: "Get your team to guess: <strong>THE TEN COMMANDMENTS</strong>", taboo: ["Moses", "Stone", "Ten", "Law", "Mount"] },
        { type: "Describe", content: "Get your team to guess: <strong>DAVID AND GOLIATH</strong>", taboo: ["Giant", "Sling", "Stone", "Shepherd", "Fight"] },
        { type: "Describe", content: "Get your team to guess: <strong>THE LAST SUPPER</strong>", taboo: ["Jesus", "Bread", "Wine", "Disciples", "Night"] }
    ];

    let scoreA = 0;
    let scoreB = 0;
    let isTeamATurn = true;
    let timerInterval;
    let currentCardPoints = 1;
    let currentCardIndex = -1;
    let usedCardIndices = [];

    const cardDisplayEl = document.getElementById('cardDisplay');
    const btnDraw = document.getElementById('btnDraw');
    const btnReveal = document.getElementById('btnReveal');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');
    const timerEl = document.getElementById('timer');

    function drawCard() {
        // Filter out used cards
        const availableIndices = gameDeck
            .map((_, index) => index)
            .filter(index => !usedCardIndices.includes(index));

        if (availableIndices.length === 0) {
            cardDisplayEl.innerHTML = `
                <div class="card-category">All Cards Used</div>
                <div class="card-content">Reset the game to play again.</div>
            `;
            btnDraw.disabled = true;
            btnReveal.style.display = "none";
            btnCorrect.disabled = true;
            btnWrong.disabled = true;
            return;
        }

        // Pick random card
        currentCardIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        usedCardIndices.push(currentCardIndex);
        const card = gameDeck[currentCardIndex];

        // Determine points
        currentCardPoints = card.type.includes("3pt") ? 3 : 1;

        // Render card
        let html = `<div class="card-category">${card.type}</div>
                    <div class="card-content">${card.content}</div>`;

        if (card.taboo) {
            html += `<ul class="taboo-list">`;
            card.taboo.forEach(word => {
                html += `<li>${word}</li>`;
            });
            html += `</ul>`;
        }

        if (card.answer) {
            html += `<div class="answer-box" id="answerBox">${card.answer}</div>`;
            btnReveal.style.display = "block";
        } else {
            btnReveal.style.display = "none";
        }

        cardDisplayEl.innerHTML = html;

        // Enable scoring buttons
        btnCorrect.disabled = false;
        btnWrong.disabled = false;
        btnDraw.disabled = true;

        // Start timer
        startTimer();
    }

    function startTimer() {
        let timeLeft = 60;
        timerEl.textContent = timeLeft;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                // Auto-fail when time runs out
                handleScore(false);
            }
        }, 1000);
    }

    function revealAnswer() {
        const answerBox = document.getElementById('answerBox');
        if (answerBox) {
            answerBox.style.display = "block";
        }
    }

    function handleScore(isCorrect) {
        clearInterval(timerInterval);
        if (isCorrect) {
            if (isTeamATurn) {
                scoreA += currentCardPoints;
                document.getElementById('scoreA').textContent = scoreA;
            } else {
                scoreB += currentCardPoints;
                document.getElementById('scoreB').textContent = scoreB;
            }
        }
        endTurn();
    }

    function endTurn() {
        clearInterval(timerInterval);
        isTeamATurn = !isTeamATurn;
        document.getElementById('currentTeam').textContent = isTeamATurn ? "Team A" : "Team B";
        cardDisplayEl.innerHTML = `<div class="card-category">Next Turn</div> <div class="card-content">Hand the device to the next team and press Draw!</div>`;
        btnDraw.disabled = false;
        btnReveal.style.display = "none";
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        timerEl.textContent = "60";
    }

    function resetGame() {
        if(confirm("Are you sure you want to reset the current game scores?")) {
            clearInterval(timerInterval);
            scoreA = 0;
            scoreB = 0;
            isTeamATurn = true;
            usedCardIndices = [];
            currentCardIndex = -1;
            document.getElementById('scoreA').textContent = "0";
            document.getElementById('scoreB').textContent = "0";
            document.getElementById('currentTeam').textContent = "Team A";
            timerEl.textContent = "60";
            cardDisplayEl.innerHTML = `<div class="card-category">Ready?</div> <div class="card-content">Press "Draw Next Card" to start your turn!</div>`;
            btnDraw.disabled = false;
            btnReveal.style.display = "none";
            btnCorrect.disabled = true;
            btnWrong.disabled = true;
        }
    }
</script>

</body>
</html>
